name: scan

on:
  schedule:
    - cron: '*/5 * * * *'   # best effort: GitHub starts these late (~every 30-36 min); loop.sh covers the gap
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coin-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Scan every 5 min for ~38 min, committing state after each scan (log only)
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: bash loop.sh

      - name: Commit any leftover state (if the loop was cut off)
        if: failure() || cancelled()
        run: bash loop.sh --commit-only
